# Test deployment for merge_mode (write each document once). Deploy only this file:
#   prefect deploy --prefect-file prefect/write_once_test.yaml -n gc-opensearch-loader-write-once-test
name: CRDC Open Search Loader
prefect-version: null
build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/CBIIT/opensearch-loader.git
      branch: write-once-merge
      include_submodules: True
  - prefect.deployments.steps.set_working_directory:
      directory: "/opt/prefect/opensearch-loader-write-once-merge"
  - prefect.deployments.steps.pip_install_requirements:
      requirements_file: requirements.txt
      stream_output: False

deployments:
  - name: gc-opensearch-loader-write-once-test
    version: null
    tags: []
    description: "Write-once merge test. Only runs against hosts containing required_host."
    schedule: {}
    flow_name: null
    entrypoint: opensearch_loader/prefect_cli_new.py:opensearch_loader_prefect
    parameters:
      secret_name: "gen/amit-opensearch"
      required_host: "amit-opensearch"
      merge_mode: true
      merge_dir: ""
      parallel_writes: false
      index_workers: 4
      model_repo_url: "https://github.com/CBIIT/cds-model.git"
      model_branch: "13.0.1"
      mono_repo_url: "https://github.com/CBIIT/general-commons.git"
      monorepo_branch: "4.9.0"
      about_file: "frontend/src/content/dev/aboutPagesContent.yaml"
      indices_file: "backend/src/main/resources/yaml/indices.yaml"
      selected_indices: ["dashboard_file"]
    work_pool:
      name: cds-general-mgconsole-prefect-3.4.18-python3.12
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "OpenSearchLoader"

  - name: gc-opensearch-compare-indices
    version: null
    tags: []
    description: "Read-only comparison of one index between two OpenSearch domains."
    schedule: {}
    flow_name: null
    entrypoint: opensearch_loader/compare_indices.py:compare_indices
    parameters:
      reference_secret: "gen/dev2-cdk"
      candidate_secret: "gen/amit-opensearch"
      index: "dashboard_file"
    work_pool:
      name: cds-general-mgconsole-prefect-3.4.18-python3.12
      work_queue_name: default

  - name: gc-memgraph-inspect
    version: null
    tags: []
    description: "Read-only: running transactions, indexes, storage info and settings."
    schedule: {}
    flow_name: null
    entrypoint: opensearch_loader/memgraph_inspect.py:memgraph_inspect
    parameters:
      secret_name: "gen/amit-opensearch"
      samples: 6
      interval_seconds: 15
    work_pool:
      name: cds-general-mgconsole-prefect-3.4.18-python3.12
      work_queue_name: default

  - name: gc-memgraph-profile
    version: null
    tags: []
    description: "Read-only: time one page of selected loader queries and show PROFILE plans."
    schedule: {}
    flow_name: null
    entrypoint: opensearch_loader/memgraph_profile.py:memgraph_profile
    parameters:
      secret_name: "gen/amit-opensearch"
      monorepo_branch: "4.9.0"
    work_pool:
      name: cds-general-mgconsole-prefect-3.4.18-python3.12
      work_queue_name: default

  - name: gc-memgraph-keyset-test
    version: null
    tags: []
    description: "Read-only: full-pass timing of SKIP vs keyset pagination, with result comparison."
    schedule: {}
    flow_name: null
    entrypoint: opensearch_loader/memgraph_keyset_test.py:memgraph_keyset_test
    parameters:
      secret_name: "gen/amit-opensearch"
      monorepo_branch: "4.9.0"
    work_pool:
      name: cds-general-mgconsole-prefect-3.4.18-python3.12
      work_queue_name: default

  - name: gc-opensearch-manage-indices
    version: null
    tags: []
    description: "List indices on amit-opensearch; delete only the exact names passed."
    schedule: {}
    flow_name: null
    entrypoint: opensearch_loader/manage_indices.py:manage_indices
    parameters:
      secret_name: "gen/amit-opensearch"
      required_host: "amit-opensearch"
      delete_indices: []
    work_pool:
      name: cds-general-mgconsole-prefect-3.4.18-python3.12
      work_queue_name: default
